name: Fetch volume ranking

# 2026-08-06 新增：取代雲端 AI agent 用 WebSearch 硬湊候選池的降級方案。TWSE/TAIFEX
# 只封鎖雲端 agent 的沙盒 IP，GitHub Actions 從沒被擋過（refresh-prices.yml 每 5 分鐘
# 查 TWSE MIS 的紀錄就是證明），改在這裡用開放資料 API 抓，daily-report-prompt.md
# 第 1 步優先讀這裡寫出來的 data/volume-ranking/latest.json。
# 由 cron-job.org 在 08:15 Asia/Taipei（報告生成前 15 分鐘）外部觸發，理由同
# refresh-prices.yml 開頭註解：GitHub 原生 schedule 不夠準時。

on:
  workflow_dispatch: {}

concurrency:
  group: fetch-volume-ranking
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch TWSE volume/change ranking
        run: node scripts/fetch-volume-ranking.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/volume-ranking/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update volume ranking for $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase; then
              git push && exit 0
            fi
            if git status --short | grep -q '^UU'; then
              git checkout --theirs data/volume-ranking/latest.json
              git add data/volume-ranking/latest.json
              git rebase --continue --no-edit || git rebase --abort
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 10))
          done
          exit 1
