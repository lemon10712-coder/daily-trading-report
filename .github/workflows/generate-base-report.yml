name: Generate daily report

# 2026-08-06 新增，2026-08-12 確定為唯一正式來源：完全不用 AI、不用 WebSearch，純粹用
# TWSE 官方即時 API 算出當天的進場/停利/停損報告。背景：CCR（Claude 雲端 AI routine）
# 8/5、8/6、8/7、8/10、8/11 反覆卡死沒有產出，官方文件本身也明講 CCR 屬於 research
# preview、不建議用在關鍵自動化上。2026-08-12 起 CCR 每日排程已暫停，不再有「等 CCR
# 恢復就覆蓋」這種機制——這個 workflow 產生的就是每個交易日唯一、最終的正式報告。
#
# 每個交易日 08:20 觸發，確保使用者每天固定時間前收到 LINE 通知。

on:
  workflow_dispatch: {}

concurrency:
  group: generate-base-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate base report if today's is missing
        run: node scripts/generate-base-report.js

      - name: Validate before publishing
        run: node scripts/validate-report.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Daily report for $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase; then
              git push && exit 0
            fi
            if git status --short | grep -q '^UU'; then
              git checkout --theirs data/latest.json
              git add data/latest.json
              git rebase --continue --no-edit || git rebase --abort
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Push to LINE (only if this workflow actually generated a new base report)
        if: steps.commit.outputs.changed == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node scripts/notify-report-summary.js
