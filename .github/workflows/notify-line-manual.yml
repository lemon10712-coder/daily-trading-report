name: Manual LINE notify

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Text to broadcast to the LINE Official Account'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send LINE broadcast
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node scripts/notify-line.js "${{ inputs.message }}"
