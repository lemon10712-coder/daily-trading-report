name: Publish daily PDF

on:
  push:
    paths:
      - 'data/latest.json'
      - 'data/backtest-latest.json'
      - 'scripts/generate-pdf.py'
  workflow_run:
    # "Daily backtest" 見下方註解。"Generate base report (CCR fallback)" 2026-08-11
    # 新增：這支腳本也用預設 GITHUB_TOKEN commit（同樣的反遞迴限制），且它現在是
    # 每天 08:20 就跑的主力保底層——沒有這個 trigger，08:20 產生的基礎版報告會
    # 完全沒有 PDF，一路空窗到下午 14:20 backtest 跑完才補上，這段期間
    # daily-health.yml 的「morning PDF is missing」檢查會誤判成失敗（2026-08-10/11
    # 的 gh run 紀錄證實了這個空窗確實發生過）。
    workflows: ['Daily backtest', 'Generate base report (CCR fallback)']
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: publish-daily-pdf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pdf:
    # "Daily backtest" commits data/backtest-latest.json using the default
    # GITHUB_TOKEN, and GitHub does not let GITHUB_TOKEN-authored pushes
    # trigger other workflows (anti-recursion protection). That silently
    # broke the push trigger above for the backtest file, so the final
    # (backtest-included) PDF never regenerated after the morning PDF ran.
    # This workflow_run trigger closes that gap by reacting to the backtest
    # workflow's completion directly, independent of who made the push.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei poppler-utils
          python -m pip install --disable-pip-version-check reportlab pypdf

      - name: Generate morning or final PDF
        run: python scripts/generate-pdf.py --mode auto

      - name: Render and verify every generated page
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          manifest = json.loads(Path('data/pdf-latest.json').read_text(encoding='utf-8'))
          checked = 0
          for key in ('morning_pdf', 'final_pdf'):
              value = manifest.get(key)
              if not value:
                  continue
              path = Path(value)
              reader = PdfReader(path)
              assert len(reader.pages) > 0, f'{path} has no pages'
              assert path.stat().st_size > 10_000, f'{path} is too small'
              text = ''.join((page.extract_text() or '') for page in reader.pages)
              assert manifest['date'] in text, f'{path} does not contain report date'
              checked += 1
          assert checked > 0, 'No PDF found in manifest'
          PY
          mkdir -p /tmp/pdf-render
          while IFS= read -r pdf; do
            stem=$(basename "$pdf" .pdf)
            pdftoppm -png -r 72 "$pdf" "/tmp/pdf-render/$stem" >/dev/null
          done < <(find reports -type f -name '*.pdf')
          test -n "$(find /tmp/pdf-render -type f -name '*.png' -print -quit)"

      - name: Commit PDFs and manifest
        id: commit
        run: |
          git config user.name "daily-pdf-bot"
          git config user.email "daily-pdf-bot@users.noreply.github.com"
          git add reports/ data/pdf-latest.json
          git diff --cached --quiet && exit 0
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Publish PDF for $(python -c "import json;print(json.load(open('data/pdf-latest.json'))['date'])")"
          # 2026-08-11 修正：這支 workflow 現在有兩條 workflow_run 觸發來源（Daily backtest／
          # Generate base report），加上還可能被 push 觸發同時撞上，兩個 run 幾乎同時想 commit
          # 同一份 PDF 時，rebase 會撞到真的內容衝突（PDF 是二進位檔案，git 沒辦法自動合併），
          # 不是單純 fast-forward 沒跟上。之前只在 refresh-prices.yml／generate-base-report.yml
          # 修過這個坑，這支腳本一直沒補——PDF 內容是兩邊各自從同一份 data/latest.json
          # 重新產生出來的，本來就應該等價，撞到衝突時直接放棄自己這次的 commit、採用對方已經
          # push 上去的版本即可，不需要、也不應該去手動合併兩份 PDF 二進位內容。
          for attempt in 1 2 3; do
            if git pull --rebase; then
              git push && exit 0
            fi
            if git status --short | grep -qE '^(UU|AA)'; then
              echo "Real conflict detected (not just fast-forward) — our PDF and the other run's PDF are both regenerated from the same data/latest.json, so discarding ours and keeping theirs is safe."
              git rebase --abort
              git fetch origin main
              git reset --hard origin/main
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Notify LINE
        if: steps.commit.outputs.changed == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          node -e "
          const fs = require('fs');
          const pdf = JSON.parse(fs.readFileSync('data/pdf-latest.json', 'utf8'));
          const backtest = fs.existsSync('data/backtest-latest.json')
            ? JSON.parse(fs.readFileSync('data/backtest-latest.json', 'utf8')) : null;
          const hasBacktest = backtest && backtest.date === pdf.date;
          const url = 'https://lemon10712-coder.github.io/daily-trading-report/';
          let msg;
          if (hasBacktest && pdf.final_pdf) {
            const review = backtest.strategy_review || {};
            const picks = Object.values(backtest.picks || {}).filter(Boolean);
            const lines = picks.map((p) => p.name + '(' + p.symbol + ') ' + p.label + (p.entry_triggered ? '，淨' + p.net_pct + '%' : ''));
            msg = '📊 今天回測算完了：\n' + lines.join('\n')
              + '\n平均品質分數 ' + review.average_score + '/100（' + review.verdict + '）'
              + '\n完整報告：' + url;
          } else {
            msg = '📈 今天的當沖報告已經產生：' + url;
          }
          require('child_process').execSync('node scripts/notify-line.js ' + JSON.stringify(msg), { stdio: 'inherit' });
          "
